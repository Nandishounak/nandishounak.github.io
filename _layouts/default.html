<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <div class="brand">
        <a href="{{ '/' | relative_url }}">Shounak Nandi</a>
      </div>
      <nav>
        <a href="{{ '/' | relative_url }}">About</a>
        <a href="{{ '/research' | relative_url }}">Research</a>
        <a href="{{ '/news' | relative_url }}">News</a>
        <a href="{{ '/assets/CV.pdf' | relative_url }}">CV</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Inspired by <a href="https://zstoebs.github.io/" target="_blank" rel="noopener">Zachary Stoebner</a>.</p>
    </div>
  </footer>

  <script>
    // Random profile photo on each page load
    var photos = [
      "/assets/img/profile1.jpg",
      "/assets/img/profile2.jpg",
      "/assets/img/profile3.jpg"
    ];
    var img = document.getElementById("profile-photo");
    if (img) {
      var pick = photos[Math.floor(Math.random() * photos.length)];
      img.src = pick;
    }
  </script>
</body>
</html>
